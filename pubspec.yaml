name: clipvault
description: A private, offline-first personal content saver.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  url_launcher: ^6.3.1
  http: ^1.6.0
  cached_network_image: ^3.4.1
  animations: 2.0.11
  flutter_animate: 4.5.2
  flutter_slidable: 4.0.3
  google_fonts: 6.2.1
  shared_preferences: 2.5.3
  skeletonizer: 2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/Logo/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/Logo/logo.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/Logo/logo.png

